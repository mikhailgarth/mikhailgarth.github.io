{{ define "main" }}

<article class="essay">
  <div class="essay-meta">
    {{ if .Params.caseno }}<span class="caseno">No. {{ .Params.caseno }}</span>{{ end }}
    <time>{{ .Date.Format "January 2, 2006" }}</time>
  </div>

  <h1 class="essay-title">{{ .Title }}</h1>

  <div class="essay-body">
    {{ .Content }}
  </div>

  {{ if .Site.Params.kofiURL }}
  <div class="redact-cta">
    <a href="{{ .Site.Params.kofiURL }}" class="continue-link">
      <span class="redact-bar"></span>
      <span class="continue-text">Support this work on Ko-fi →</span>
    </a>
  </div>
  {{ end }}
</article>

{{ end }}
